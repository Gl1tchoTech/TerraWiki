name: TerraWiki
options:
  bundleIdPrefix: com.terraria
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TerraWiki:
    type: application
    platform: iOS
    sources:
      - path: TerraWiki
        excludes:
          - Resources
    resources:
      - path: TerraWiki/Resources/Assets.xcassets
      - path: TerraWiki/Resources/items.json
      - path: TerraWiki/Resources/npcs.json
      - path: TerraWiki/Resources/bosses.json
      - path: TerraWiki/Resources/mechanics.json
    preBuildScripts:
      - name: Copy wiki database into app bundle
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          cp "${SRCROOT}/TerraWiki/Resources/"*.json "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/"
    info:
      path: TerraWiki/Info.plist
      properties:
        CFBundleDisplayName: TerraWiki
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.terraria.wiki
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  TerraWikiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TerraWikiTests
    dependencies:
      - target: TerraWiki
    resources:
      - path: TerraWiki/Resources/Assets.xcassets
      - path: TerraWiki/Resources/items.json
      - path: TerraWiki/Resources/npcs.json
      - path: TerraWiki/Resources/bosses.json
      - path: TerraWiki/Resources/mechanics.json
    preBuildScripts:
      - name: Copy wiki database into test bundle
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          cp "${SRCROOT}/TerraWiki/Resources/"*.json "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.terraria.wiki.tests
        GENERATE_INFOPLIST_FILE: YES
